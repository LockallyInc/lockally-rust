# Release workflow for the Rust SDK (crates.io crate `lockally`).
#
# TEMPLATE — inert in this monorepo. Copy to `.github/workflows/publish.yml` in
# the SDK's own repo (generated `sdk/rust/` tree, pushed to
# github.com/lockallyinc/lockally-rust). Tag-driven: push `vX.Y.Z`.
#
# One-time setup:
#   - Add repo secret CARGO_REGISTRY_TOKEN = a crates.io API token with
#     publish-update scope for the `lockally` crate. (crates.io also supports OIDC
#     trusted publishing if you prefer no token.)
name: Publish crate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
