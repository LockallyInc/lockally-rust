# Release workflow for the Rust SDK (crates.io crate `lockally`).
#
# TEMPLATE, inert in this monorepo. Copy to `.github/workflows/publish.yml` in
# the SDK's own repo (generated `sdk/rust/` tree, pushed to
# github.com/lockallyinc/lockally-rust). Tag-driven: push `vX.Y.Z`.
#
# One-time setup (OIDC trusted publishing, so NO API token and no repo secret):
#   - On crates.io → the `lockally` crate → Settings → Trusted Publishing → Add:
#       Repository owner:  LockallyInc
#       Repository name:   lockally-rust
#       Workflow filename: publish.yml
#       Environment:       leave empty (this workflow declares none)
#   - The auth action below exchanges the job's OIDC token for a token that is
#     revoked again when the job ends, and hands it to cargo through the same
#     CARGO_REGISTRY_TOKEN the stored secret used to fill.
#   Claude never handles these credentials: the policy is registered by the
#   account owner on crates.io.
name: Publish crate

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC trusted publishing (no stored API token)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      # `cargo publish` with an empty CARGO_REGISTRY_TOKEN reports "no token
      # found", which reads like a missing secret rather than a missing policy.
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::crates.io returned no token for this run, so no trusted publisher matches it. Check owner LockallyInc, repository ${GITHUB_REPOSITORY#*/}, workflow filename publish.yml and no environment under the crate's Trusted Publishing settings."
            exit 1
          fi
          cargo publish
